<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create client access for the ExtensionForge browser extension dashboard." />
    <title>Signup | ExtensionForge</title>
    <script src="assets/js/theme-init.js"></script>
    <script src="assets/js/tailwind.config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
      <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  </head>
  <body>
    <main class="signup-shell">
      <div class="absolute right-4 top-4 flex gap-2">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme"></button>
        <button class="icon-btn" type="button" data-rtl-toggle aria-label="Toggle RTL"></button>
      </div>
      <section class="auth-card p-6 sm:p-8">
        <div class="mb-8 text-center">
          <a href="index.html" class="mb-6 inline-flex items-center gap-3 text-left">
            <span class="brand-mark"><i data-lucide="blocks" class="h-5 w-5"></i></span>
            <span class="min-w-0">
              <span class="block truncate font-heading text-xl font-extrabold">ExtensionForge</span>
              <span class="block truncate text-xs font-bold text-slate-500 dark:text-slate-400">Client dashboard</span>
            </span>
          </a>
          <h1 class="font-heading text-3xl font-extrabold">Create client access</h1>
          <p class="mt-2 text-sm font-semibold text-slate-500 dark:text-slate-400">Review specs, beta builds, analytics, reports, and secure project messages.</p>
        </div>
        <div class="grid gap-3 sm:grid-cols-3">
          <button class="btn btn-ghost px-2" type="button">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            <span class="text-xs sm:text-sm">Google</span>
          </button>
          <button class="btn btn-ghost px-2" type="button">
            <i data-lucide="github" class="h-4 w-4"></i>
            <span class="text-xs sm:text-sm">GitHub</span>
          </button>
          <button class="btn btn-ghost px-2" type="button">
            <i data-lucide="apple" class="h-4 w-4"></i>
            <span class="text-xs sm:text-sm">Apple</span>
          </button>
        </div>
        <div class="my-6 flex items-center gap-3 text-xs font-black uppercase text-slate-500 dark:text-slate-400"><span class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></span>or use email<span class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></span></div>
        <form class="grid gap-4" data-demo-form>
          <label class="grid gap-2 text-left text-sm font-bold">Full Name<input class="form-field text-left" required placeholder="Full name" /></label>
          <label class="grid gap-2 text-left text-sm font-bold">Company Name<input class="form-field text-left" required placeholder="Company name" /></label>
          <label class="grid gap-2 text-left text-sm font-bold">Email<input class="form-field text-left" type="email" required placeholder="you@company.com" /></label>
          <label class="grid gap-2 text-left text-sm font-bold">Password<span class="relative"><input id="signup-password" class="form-field pr-12 text-left" type="password" required placeholder="Create password" /><button class="icon-btn absolute right-1 top-1 h-10 w-10" type="button" data-password-toggle="signup-password" aria-label="Show password"><i data-lucide="eye" class="h-4 w-4"></i></button></span></label>
          <label class="grid gap-2 text-left text-sm font-bold">Confirm Password<span class="relative"><input id="signup-confirm-password" class="form-field pr-12 text-left" type="password" required placeholder="Confirm password" /><button class="icon-btn absolute right-1 top-1 h-10 w-10" type="button" data-password-toggle="signup-confirm-password" aria-label="Show confirm password"><i data-lucide="eye" class="h-4 w-4"></i></button></span></label>
          <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 mt-2">By creating an account, you agree to our <a href="#" class="text-primary hover:underline">Terms of Service</a> and <a href="#" class="text-primary hover:underline">Privacy Policy</a>.</p>
          <button class="btn btn-primary mt-2" type="submit"><i data-lucide="user-plus" class="h-4 w-4"></i>Create Secure Account</button>
          <p class="text-center text-sm font-semibold text-primary" data-form-status></p>
        </form>
        <p class="mt-6 text-center text-sm font-semibold text-slate-500 dark:text-slate-400">Already have access? <a class="text-primary hover:underline" href="login.html">Log In</a></p>
      </section>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
