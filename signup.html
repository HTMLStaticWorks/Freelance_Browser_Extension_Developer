<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create client access for the ExtensionForge browser extension dashboard." />
    <title>Signup | ExtensionForge</title>
    <script src="assets/js/theme-init.js"></script>
    <script src="assets/js/tailwind.config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
      <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  </head>
  <body>
    <main class="signup-shell">
      <div class="absolute right-4 top-4 flex gap-2">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme"></button>
        <button class="icon-btn" type="button" data-rtl-toggle aria-label="Toggle RTL"></button>
      </div>
      <section class="auth-card p-6 sm:p-8">
        <div class="mb-8 text-center">
          <a href="index.html" class="mb-6 inline-flex items-center gap-3">
            <span class="brand-mark"><i data-lucide="blocks" class="h-5 w-5"></i></span>
            <span class="font-heading text-xl font-extrabold">ExtensionForge</span>
          </a>
          <h1 class="font-heading text-3xl font-extrabold">Create client access</h1>
          <p class="mt-2 text-sm font-semibold text-slate-500 dark:text-slate-400">Review specs, beta builds, analytics, reports, and secure project messages.</p>
        </div>
        <div class="grid gap-3 sm:grid-cols-2">
          <button class="btn btn-ghost" type="button"><i data-lucide="globe-2" class="h-4 w-4"></i>Google</button>
          <button class="btn btn-ghost" type="button"><i data-lucide="github" class="h-4 w-4"></i>GitHub</button>
        </div>
        <div class="my-6 flex items-center gap-3 text-xs font-black uppercase text-slate-500 dark:text-slate-400"><span class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></span>or use email<span class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></span></div>
        <form class="grid gap-4" data-demo-form>
          <label class="grid gap-2 text-sm font-bold">Full Name<input class="form-field" required placeholder="Full name" /></label>
          <label class="grid gap-2 text-sm font-bold">Company Name<input class="form-field" required placeholder="Company name" /></label>
          <label class="grid gap-2 text-sm font-bold">Email<input class="form-field" type="email" required placeholder="you@company.com" /></label>
          <label class="grid gap-2 text-sm font-bold">Password<span class="relative"><input id="signup-password" class="form-field pr-12" type="password" required placeholder="Create password" /><button class="icon-btn absolute right-1 top-1 h-10 w-10" type="button" data-password-toggle="signup-password" aria-label="Show password"><i data-lucide="eye" class="h-4 w-4"></i></button></span></label>
          <label class="grid gap-2 text-sm font-bold">Confirm Password<span class="relative"><input id="signup-confirm-password" class="form-field pr-12" type="password" required placeholder="Confirm password" /><button class="icon-btn absolute right-1 top-1 h-10 w-10" type="button" data-password-toggle="signup-confirm-password" aria-label="Show confirm password"><i data-lucide="eye" class="h-4 w-4"></i></button></span></label>
          <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 mt-2">By creating an account, you agree to our <a href="#" class="text-primary hover:underline">Terms of Service</a> and <a href="#" class="text-primary hover:underline">Privacy Policy</a>.</p>
          <button class="btn btn-primary mt-2" type="submit"><i data-lucide="user-plus" class="h-4 w-4"></i>Create Secure Account</button>
          <p class="text-center text-sm font-semibold text-primary" data-form-status></p>
        </form>
        <p class="mt-6 text-center text-sm font-semibold text-slate-500 dark:text-slate-400">Already have access? <a class="text-primary hover:underline" href="login.html">Log In</a></p>
      </section>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
